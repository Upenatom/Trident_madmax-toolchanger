# This file contains common pin mappings for the SHT36 V3
# when setup for T0

#####################################################################
#   MCU Definition
#####################################################################

[mcu toolboard_1]
canbus_uuid: 3642a2418039

#####################################################################
#   Extruder
#####################################################################

[extruder1]
step_pin: toolboard_1: gpio7
dir_pin: !toolboard_1: gpio6
enable_pin: !toolboard_1: gpio14
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.678 is a good starting point for CW2
##  Current extruder: G2SA
##--------------------------------------------------------------------
rotation_distance: 13.67184
##--------------------------------------------------------------------
#gear_ratio: 50:10 # CW2 gear ratio
gear_ratio: 50:17

microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.40
filament_diameter: 1.75
control: pid
pid_Kp: 44.616
pid_Ki: 12.932
pid_Kd: 38.480
#max_extrude_cross_section: 1.75
#max_extrude_only_distance: 100.0

#####################################################################
#   Heater
#####################################################################

heater_pin: toolboard_1: gpio23
sensor_type: ATC Semitec 104GT-2
sensor_pin: toolboard_1: gpio27
min_temp: 0
max_temp: 350
max_power: 1.0

min_extrude_temp: 170

##--------------------------------------------------------------------
## Pressure Advance
pressure_advance: 0.042             # Try to keep pressure_advance below 1.0
pressure_advance_smooth_time: 0.040 # Default is 0.040, leave stock
##--------------------------------------------------------------------

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 extruder1]
uart_pin: toolboard_1: gpio15
interpolate: false
run_current: 0.8
sense_resistor:0.110
stealthchop_threshold:0

# [extruder_stepper helpert0]
# extruder: extruder
# #   The extruder this stepper is synchronized to. If this is set to an
# #   empty string then the stepper will not be synchronized to an
# #   extruder. This parameter must be provided.
# step_pin: PE6
# dir_pin: PA14
# enable_pin: !PE0
# microsteps: 16
# rotation_distance: 22.678
# gear_ratio: 50:10

# ##  Make sure to update below for your relevant driver (2208 or 2209)
# [tmc2209 extruder_stepper helpert0]
# uart_pin: PD3
# interpolate: false
# run_current: 0.60

#####################################################################
#   Fan Control
#####################################################################

[fan_generic part_fan_t1]
##  Print Cooling Fan
pin: toolboard_1: gpio13
kick_start_time: 0.5
off_below: 0.10

## Hotend fan
[heater_fan extruder1_fan]
Pin: toolboard_1: gpio21
max_power: 1.0
kick_start_time: 0.5
heater: extruder1
heater_temp: 50.0
##  If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0
#tachometer_pin: ^toolboard_1: PB9
#tachometer_ppr: 2
#   When tachometer_pin is specified, this is the number of pulses per
#   revolution of the tachometer signal. For a BLDC fan this is
#   normally half the number of poles. The default is 2.
#tachometer_poll_interval: 0.0008

#####################################################################
#   Toolhead 0 LEDs
#####################################################################

#[neopixel th_leds_t0]
#pin: toolboard_1: PD3
#   The pin connected to the neopixel. This parameter must be provided.
#chain_count: 3
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. The default is 1 (which indicates only a single
#   Neopixel is connected to the pin).
#color_order: GRBW
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, GRBW, or RGBW. The default is GRB.
#initial_RED: 1.0
#initial_GREEN: 0.0
#initial_BLUE: 1.0
#initial_WHITE: 0.0
#   Sets the initial LED color of the Neopixel. Each value should be
#   between 0.0 and 1.0. The WHITE option is only available on RGBW
#   LEDs. The default for each color is 0.#

#####################################################################
#   Toolhead 0 Filament runout switch
#####################################################################

#[filament_switch_sensor T0_Filament_Runout_Sensor]
#pause_on_runout: False
#runout_gcode:
#insert_gcode:
#switch_pin: toolboard_1: PB8

#####################################################################
#   Accelerometer
#####################################################################
#[lis2dw]
[lis2dw toolboard_1]
cs_pin: toolboard_1:gpio12
spi_bus:spi0_gpio4_gpio3_gpio2
#--------------------------------------------------------------------
#[resonance_tester]
#accel_chip: lis2dw
[resonance_tester]
accel_chip: lis2dw toolboard_1
probe_points: 150, 150, 20
# Somewhere slightly above the middle of your print bed
min_freq: 5
max_freq: 133
accel_per_hz: 75
hz_per_sec: 1

#####################################################################
#   Temperature Sensor
#####################################################################

[temperature_sensor toolboard_1]
sensor_type: temperature_mcu
sensor_mcu: toolboard_1
min_temp: 0
max_temp: 370


#####################################################################
#   gcode_macro T1
#####################################################################

[gcode_macro T1]
variable_color: ""
variable_tool_number: 1
gcode:
  _CHANGE_TOOL T={tool_number}

[tool T1]
tool_number: 1
extruder: extruder1
#fan: fan_generic part_fan_t1
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
# Position with the toolhead aligned with the dock
params_park_x: 292.5
params_detach_x: 287.5
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 48.8
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 71.2
#detection_pin: toolboard_1: PB6

[tool_probe T1]
pin: toolboard_1: gpio16
tool: 1
z_offset: 0
speed: 2.5
samples: 4
samples_result: median
sample_retract_dist: 1.0
samples_tolerance: 0.05
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder1